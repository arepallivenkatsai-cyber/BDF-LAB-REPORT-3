# ===========================================================================
# Render.com Deployment Configuration
# BDF Lab 03 REST API — Aurora University | A.VENKATA SAI (252U1R5010)
# ===========================================================================
#
# PRIMARY DEPLOYMENT: Docker (node:22-bookworm-slim)
# This is the most reliable option because:
#   - sqlite3@6.0.1 uses prebuild-install (downloads prebuilt GLIBC_2.38 binaries)
#   - Docker builds sqlite3 from source inside the EXACT same container it runs in
#   - npm_config_build_from_source=true instructs prebuild-install to compile from src
#
# ALTERNATIVE (if Docker is not desired): Use the native Node service below.
# ===========================================================================

services:
  # -------------------------------------------------------------------------
  # OPTION 1: Docker Service (PRIMARY - Guaranteed GLIBC compatibility)
  # -------------------------------------------------------------------------
  - type: web
    name: bdf-lab-03-rest-api
    runtime: docker
    region: singapore
    plan: free

    # Dockerfile location relative to repo root
    dockerfilePath: backend/Dockerfile
    # Build context = backend/ folder
    dockerContext: backend

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/books.db
